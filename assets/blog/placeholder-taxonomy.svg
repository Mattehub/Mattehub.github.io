<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-label="Diagram of interaction order taxonomy">
  <rect width="520" height="330" fill="#f8f4fb"/>
  <rect x="24" y="24" width="472" height="282" rx="18" fill="#ffffff" stroke="#e2d8ee"/>
  <rect x="80" y="210" width="100" height="32" rx="10" fill="#8fbfe0"/>
  <rect x="210" y="160" width="100" height="32" rx="10" fill="#cdb4db"/>
  <rect x="340" y="110" width="100" height="32" rx="10" fill="#f7a9a8"/>
  <line x1="180" y1="210" x2="210" y2="176" stroke="#a58bb7" stroke-width="3"/>
  <line x1="310" y1="160" x2="340" y2="126" stroke="#a58bb7" stroke-width="3"/>
  <text x="130" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2a2a2a">order 2</text>
  <text x="260" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2a2a2a">order 3</text>
